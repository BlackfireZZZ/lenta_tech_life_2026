runtime:
  profile_name: zeroshot_nolabel
  output_path: null
  log_every_n_frames: 40
  seed: 42
  fps_override: null

detector:
  backend: yolo_world
  model_path: yolov8x-worldv2.pt
  conf: 0.18
  iou: 0.50
  device: null
  classes: null
  open_vocab_labels:
    - "price tag"
    - "shelf label"
    - "price label"
    - "barcode label"
  tracker_yaml: botsort.yaml
  image_size: 1280

rectifier:
  padding_ratio: 0.08
  clahe_clip_limit: 3.0
  clahe_tile_grid_size: 8
  rotate_vertical_tags: true
  keep_color: true
  perspective: true
  super_resolution: true
  sr_min_area_px: 8000

ocr:
  backend: paddle
  paddleocr_lang: ru
  min_frames_between_ocr_per_track: 3
  min_sharpness: 20.0
  min_crop_area_px: 600
  min_detection_confidence: 0.18
  top_k_crops_per_track: 6

parser:
  min_price: 0.01
  max_price: 999999.99

aggregation:
  min_observations_per_track: 1
  min_final_confidence: 0.35
  track_ttl_frames: 90
  price_fuzzy_tolerance: 0.5
  name_fuzzy_ratio: 0.82
  dedup_iou_threshold: 0.35
  dedup_time_window_frames: 220
