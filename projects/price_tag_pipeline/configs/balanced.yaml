runtime:
  profile_name: balanced
  output_path: null
  log_every_n_frames: 50
  seed: 42
  fps_override: null

detector:
  backend: yolo
  model_path: hf://openfoodfacts/price-tag-detection/weights/best.pt
  conf: 0.25
  iou: 0.50
  device: null
  classes: null
  tracker_yaml: botsort.yaml         # CMC helps because the robot moves
  image_size: 1280

rectifier:
  padding_ratio: 0.10                 # 0.10 used in the validated friends-crop run
  clahe_clip_limit: 2.5
  clahe_tile_grid_size: 8
  rotate_vertical_tags: true
  keep_color: true

ocr:
  # Validated OCR winner — worktree-ocr campaign (OCR_CAMPAIGN_LOG.md,
  # 2026-05-18). Heavy (~8.5GB VRAM, GPU); for a light CPU profile use
  # backend: paddle. The prompt + parser robustness are in code.
  backend: qwen3_vl
  vlm_model: Qwen/Qwen3-VL-4B-Instruct  # offline alt: local dir weights/qwen3-vl-4b
  vlm_max_new_tokens: 640
  vlm_temperature: 0.0
  paddleocr_lang: ru
  min_frames_between_ocr_per_track: 5
  min_sharpness: 35.0
  min_crop_area_px: 1400
  min_detection_confidence: 0.30
  top_k_crops_per_track: 5

recognition:                # crop -> fields chain: QR -> barcode -> smart OCR
  enable_qr: true
  enable_barcode: true      # 1D-barcode reader is a stub today (separate branch)
  enable_ocr: true
  merge_policy: qr_first_fill_gaps   # QR wins where it speaks; OCR fills gaps

parser:
  min_price: 0.01
  max_price: 999999.99

aggregation:
  min_observations_per_track: 2
  min_final_confidence: 0.50
  track_ttl_frames: 60
  price_fuzzy_tolerance: 0.5
  name_fuzzy_ratio: 0.85
  dedup_iou_threshold: 0.4
  dedup_time_window_frames: 150
