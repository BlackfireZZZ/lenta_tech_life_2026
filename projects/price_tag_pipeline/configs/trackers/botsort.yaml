# BoT-SORT — tuned for the Lenta robot: MOVING camera, STATIONARY tags.
#
# Why this file exists: passing a bare "botsort.yaml" makes Ultralytics load
# its OWN stock defaults and silently ignore tuning. detector.resolve_tracker_yaml
# resolves project paths so THIS file actually takes effect.
#
# Scenario shaping every value below:
#  - The robot pans laterally along a shelf. A tag enters, crosses the frame,
#    and exits an edge — once gone it must NOT be re-acquired with the same ID
#    (a different, near-identical tag may later sit in the same pixel region).
#  - The dominant failure is a few-frame DETECTION GAP mid-pan (motion blur /
#    partial occlusion): track lost -> tag re-detected -> NEW id -> duplicate
#    CSV row. Duplicates are a P0 metric hit (docs/index.md fact 3).
#  - Tags share one visual template (only the printed text differs), so
#    appearance ReID would CAUSE identity swaps, not prevent them.
#
# These are reasoned STARTING points, not proven optima. The measurement-first
# phase (tracker-only harness: #tracks / fragmentation / #FinalTags-after-dedup
# vs #GT-tags) is what validates/sweeps them. See [[verify-dont-assert]].

tracker_type: botsort

# Global motion compensation. WAS sparseOptFlow on the theory that modelling
# camera motion keeps a stationary tag's IoU high. The full494 detector-audit
# (2026-05-19, scripts-equivalent struct sweep on 25_2-10 + 49_5, full ccw
# production path) proved GMC is INERT on this footage: botsort gmc=none vs
# gmc=sparseOptFlow gives BYTE-IDENTICAL tracking metrics (raw/qual/dup/len),
# and ~1.7x faster (15.7 vs 9.1 fps proc). ByteTrack (no GMC) also matched
# BoT-SORT exactly at equal new_track_thresh. So GMC buys nothing here and
# costs throughput → off. Set back to sparseOptFlow/ecc only if a different
# (e.g. shakier) camera shows GMC actually moving the metric in the harness.
gmc_method: none

# Start a track only from a CONFIDENT detection. THE dominant (and ~only
# effective) tracker lever for this data.
#
# 0.82 was the data-driven pick for an EARLIER, weaker detector. The current
# authoritative detector (lenta_price_tag_detector_full494_off_aug_best.pt)
# emits much higher-confidence boxes (0.85–0.94, verified on clean ccw frames),
# which moves the operating point: the full494 detector-audit (2026-05-19,
# 25_2-10 gt=56 / 49_5 gt=61, full ccw production path) measured a HARD CLIFF,
# not a smooth optimum:
#   nt 0.82/0.90  -> 13–21 whole-video tracks, dup 0.16–0.38  (one ID glued
#                    across the whole pan = catastrophic, UNRECOVERABLE
#                    over-merge: ~65% of physical tags never get a row)
#   nt 0.93–0.97  -> 145–209 short tracks, raw dup ~2.5–3.1 BUT geometry+time
#                    cross-track dedup collapses that to ~1.16–1.28x gt, and
#                    the real content/barcode dedup + min_observations + the
#                    OCR-confidence gate trim it further toward 1.0
#   0.95 == 0.98  (saturated; >~0.95 changes nothing)
# match_thresh / track_buffer / tracker_type / GMC were ALL provably inert
# (identical metrics) — nt is the whole story here.
#
# Decision: over-merge is information-destroying (a glued track = one field
# vote for many tags; those tags are gone). Over-fragmentation is recoverable
# downstream by the aggregator. So operate on the recoverable side. 0.94 sits
# mid-cliff with the lowest post-dedup over-count (geomdup 1.16). This is
# verified at the tracker+geometry-dedup level; the FINAL lock needs a full
# pipeline + real OCR sweep of 0.92–0.97 scored by scripts/eval_hack_csv vs
# GT (recognition env — see detector-audit notes). Re-sweep if the detector
# changes again (this is exactly that situation).
new_track_thresh: 0.94

# First-stage association uses high-confidence detections; raise from 0.25 for
# cleaner association given our detector's score distribution.
track_high_thresh: 0.5
# Keep the ByteTrack-style second stage: low-score boxes still recover a track
# through a motion-blur dip instead of dropping it (which would fragment IDs).
track_low_thresh: 0.1

# Association cost gate. Swept 0.80/0.85/0.90 in the full494 audit with NO
# effect on any tracking metric (the new-track gate dominates entirely), so
# the stock 0.8 stays.
match_thresh: 0.8

# Frames a lost track stays alive for re-association. Stock 30 (~1s @30fps) is
# too short to bridge an occlusion/blur gap during a pan -> fragmentation.
# 60 bridges ~2s yet is short enough not to resurrect a tag that left frame.
# Kept equal to aggregation.track_ttl_frames (60) so the tracker's lost-life
# and the aggregator's finalize-TTL agree — a mismatch is itself a dup source.
# NOTE: Ultralytics warns larger buffer raises ID-switch risk on moving
# cameras. 60 is a reasoned middle; this is the #1 knob to sweep in the harness.
track_buffer: 60

# Fuse detection score into the motion/IoU cost — stabilizes weak detections.
fuse_score: True

# ReID OFF by design: price tags are one visual template, so an appearance
# model maximizes similarity across DIFFERENT tags and induces swaps. The two
# thresholds below are inert while with_reid is False; kept for documentation.
with_reid: False
proximity_thresh: 0.5
appearance_thresh: 0.8
model: auto
