# HQ profile — any model served by a local vLLM (or SGLang) server.
#
# Why this profile: model swapping is config-only. Run any of the top OCR
# VLMs (GLM-OCR, PaddleOCR-VL, Qwen3-VL, dots.ocr, HunyuanOCR, RolmOCR,
# MonkeyOCR, InternVL3) with one server and switch by changing vlm_model.
#
# Start a server, for example:
#     vllm serve zai-org/GLM-OCR --port 8000 --max-model-len 8192
#     vllm serve PaddlePaddle/PaddleOCR-VL --port 8000
#     vllm serve Qwen/Qwen3-VL-32B-Instruct --port 8000 --tensor-parallel-size 2
#     vllm serve rednote-hilab/dots.ocr --port 8000
#
# Then update vllm_url + vlm_model below.

runtime:
  profile_name: hq_vllm
  output_path: null
  log_every_n_frames: 40
  seed: 42
  fps_override: null

detector:
  backend: yolo
  model_path: data/checkpoints/detector/best.pt
  conf: 0.20
  iou: 0.50
  device: null
  classes: null
  tracker_yaml: botsort.yaml
  image_size: 1280

rectifier:
  padding_ratio: 0.08
  clahe_clip_limit: 3.0
  clahe_tile_grid_size: 8
  rotate_vertical_tags: true
  keep_color: true

ocr:
  backend: vllm_server
  vllm_url: http://localhost:8000/v1
  vlm_model: zai-org/GLM-OCR        # change to swap models
  vlm_prompt_path: null
  vlm_max_new_tokens: 512
  vlm_temperature: 0.0
  min_frames_between_ocr_per_track: 3
  min_sharpness: 28.0
  min_crop_area_px: 1000
  min_detection_confidence: 0.25
  top_k_crops_per_track: 8

parser:
  min_price: 0.01
  max_price: 999999.99

aggregation:
  min_observations_per_track: 2
  min_final_confidence: 0.55
  track_ttl_frames: 90
  price_fuzzy_tolerance: 0.5
  name_fuzzy_ratio: 0.85
  dedup_iou_threshold: 0.4
  dedup_time_window_frames: 200
