runtime:
  profile_name: hq
  output_jsonl: null
  log_every_n_frames: 40

detector:
  model_path: yolo11s.pt
  conf: 0.20
  iou: 0.50
  device: null
  classes: [0]
  tracker_yaml: ultralytics/cfg/trackers/bytetrack.yaml

rectifier:
  padding_ratio: 0.08
  clahe_clip_limit: 3.0
  clahe_tile_grid_size: 8
  rotate_vertical_tags: true

ocr:
  backend: noop
  min_frames_between_ocr_per_track: 3
  min_sharpness: 28.0
  min_crop_area_px: 1000
  min_detection_confidence: 0.25

parser:
  decimal_preferred: true
  min_price: 0.01
  max_price: 99999.99

aggregation:
  min_observations_per_track: 4
  min_final_confidence: 0.65
  track_ttl_frames: 90

