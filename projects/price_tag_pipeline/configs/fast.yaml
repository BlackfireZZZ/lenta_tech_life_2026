runtime:
  profile_name: fast
  output_path: null
  log_every_n_frames: 60
  seed: 42
  fps_override: null

detector:
  backend: yolo
  model_path: data/checkpoints/detector/best.pt   # fine-tuned, upright-trained (frame_rotation: ccw)
  conf: 0.30
  iou: 0.50
  device: null
  classes: null            # null = use all classes the trained model knows
  tracker_yaml: configs/trackers/bytetrack.yaml
  image_size: 960
  frame_rotation: ccw                # robot cam mounted 90° CW: feed the
                                     # detector upright (boxes un-projected
                                     # back to original coords).

rectifier:
  padding_ratio: 0.04
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  rotate_vertical_tags: true
  keep_color: true

ocr:
  backend: paddle           # classical PaddleOCR 3.x for speed
  paddleocr_lang: ru
  min_frames_between_ocr_per_track: 8
  min_sharpness: 45.0
  min_crop_area_px: 1800
  min_detection_confidence: 0.40
  top_k_crops_per_track: 3

recognition:                # crop -> fields chain: QR -> barcode -> smart OCR
  enable_qr: true
  enable_barcode: true      # 1D-barcode reader is a stub today (separate branch)
  enable_ocr: true
  merge_policy: qr_first_fill_gaps   # QR wins where it speaks; OCR fills gaps

parser:
  min_price: 0.01
  max_price: 999999.99

aggregation:
  min_observations_per_track: 1
  min_final_confidence: 0.45
  track_ttl_frames: 30
  price_fuzzy_tolerance: 0.5
  name_fuzzy_ratio: 0.85
  dedup_iou_threshold: 0.4
  dedup_time_window_frames: 100
