[project]
name = "lenta-ml-service"
version = "0.2.0"
description = "Deployable HTTP wrapper around the price_tag_pipeline package."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    # The model package is imported at runtime via sys.path
    # (../projects/price_tag_pipeline/src) — see app/runner.py — so this
    # service boots and mocks even without it. To run the pipeline for
    # real, install its runtime deps into this env:
    #   uv pip install -r ../projects/price_tag_pipeline/requirements/base.txt
    #   uv pip install -r ../projects/price_tag_pipeline/requirements/ocr.txt
    # (or add the path dependency once it ships a wheel):
    # "price-tag-pipeline @ file:../projects/price_tag_pipeline",
]

[dependency-groups]
dev = ["pytest"]
