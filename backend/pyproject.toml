[project]
name = "lenta-gateway"
version = "0.1.0"
description = "Price-tag gateway API — the only public service (auth, jobs, ML client)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",          # multipart video upload
    "httpx",                     # → ML service
    "sqlalchemy[asyncio]>=2",    # job/result persistence (docs/architecture.md §3.3)
    "asyncpg",                   # async Postgres driver
    "redis>=5",                  # status-read cache (fail-open, §3.9)
    # --- enabled if auth lands (documented, not implemented — §3.8) ---
    # "alembic",
    # "pyjwt",
    # "argon2-cffi",
    # "itsdangerous",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "black", "isort"]

[tool.isort]
profile = "black"
