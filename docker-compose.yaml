# Local monorepo orchestration. One `docker compose up --build` brings up the
# whole product. See docs/architecture.md §6.
#
# In the current skeleton the backend runs MOCK_MODE=true, so db/redis are
# started (they are part of the target architecture) but not yet required.
# The root ./Dockerfile is the separate CUDA *training* image — not used here.

services:
  backend:
    build: { context: ./backend }
    ports: ["8000:8000"]
    env_file: [./backend/.env]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      ML_BASE_URL: http://ml:8002
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/app:/app/app          # hot-reload
      - uploads:/data/uploads           # shared with ml (video handoff, §5)
    depends_on:
      ml: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_POLLING: "true"          # REQUIRED on Windows+Docker for HMR
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  ml:
    build: { context: ./ml }
    ports: ["8002:8002"]                # internal service; exposed for debugging
    volumes:
      - uploads:/data/uploads           # reads videos the backend wrote

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
  uploads:
