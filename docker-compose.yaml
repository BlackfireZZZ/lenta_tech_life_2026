# Local monorepo orchestration. One `docker compose up --build` brings up the
# whole product. See docs/architecture.md §6 and docs/runbooks/docker-compose.md.
#
# backend runs MOCK_MODE=false: it persists jobs in Postgres and calls the
# real `ml` service out-of-band (frontend → backend → ml → 29-col CSV). `ml`
# is the REAL GPU pipeline image (CUDA + Qwen3-VL); weights are mounted, not
# baked (see the ml service). The root ./Dockerfile is the separate CUDA
# *training* image — not used here.

services:
  backend:
    build: { context: ./backend }
    ports: ["8000:8000"]
    # backend/.env is gitignored and optional — every value the real path
    # needs is set explicitly below, so a fresh checkout `up`s with no .env.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MOCK_MODE: "false"                # real product: Postgres + ml call
      UPLOAD_ROOT: /data/uploads        # == the `uploads` volume mount (§6)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ML_BASE_URL: http://ml:8002
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/app:/app/app          # hot-reload
      - uploads:/data/uploads           # shared with ml (video handoff, §5)
    depends_on:
      ml: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_POLLING: "true"          # REQUIRED on Windows+Docker for HMR
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  ml:
    # Context is the repo ROOT (not ./ml): runner.py imports the pipeline
    # from projects/price_tag_pipeline, which must be in the build context.
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports: ["8002:8002"]                # internal service; exposed for debugging
    environment:
      HF_HOME: /models/hf               # HF cache (persists any fallback DL)
      HF_HUB_ENABLE_HF_TRANSFER: "1"    # fast download IF a model is missing
      ML_PIPELINE_CONFIG: projects/price_tag_pipeline/configs/balanced.yaml
      CATALOG_CSV: /data/catalog/db_hack.csv   # GT-safe barcode/name repair
      # ML_MOCK unset → real GPU pipeline. Set ML_MOCK=1 to force the mock CSV
      # (boots without GPU/weights — architecture.md §5).
      # Override LOCAL_DETECTOR / LOCAL_VLM to point the resolver elsewhere.
    volumes:
      - uploads:/data/uploads           # reads videos the backend wrote
      - hf_cache:/models/hf             # persists weights downloaded as a
                                        # fallback when a local copy is absent
      # LOCAL weights (optional, bind-mounted read-only). runner.py prefers
      # these if present & complete; otherwise the pipeline downloads the
      # config's HF refs into hf_cache once ("local if present, else
      # download"). A missing host path → empty dir → treated as absent.
      - ./data/checkpoints/detector/lenta_price_tag_manual_stop_best.pt:/models/local/detector.pt:ro
      - ./weights/qwen3-vl-4b:/models/local/qwen3-vl-4b:ro
      # Hot ml code (no rebuild for runner changes; mirrors backend's mount).
      - ./ml/app:/workspace/ml/app
      # Lenta master catalog (gitignored, ~625k rows). Put db_hack.csv at
      # <worktree>/real_data/db_hack.csv. Read-only; if absent the runner
      # logs and skips reconciliation (the graded run is never affected).
      - ./real_data/db_hack.csv:/data/catalog/db_hack.csv:ro
    # GPU passthrough. Works with `docker compose up` on Docker Desktop +
    # WSL2 (no NVIDIA Container Toolkit needed on Windows). If your Compose
    # is too old for this block, use the top-level `gpus: all` key instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    # postgres:18 moved the data dir; the volume must mount the PARENT
    # /var/lib/postgresql (the old /var/lib/postgresql/data path makes the
    # 18 image refuse to start — docker-library/postgres#37). The server
    # initializes into a versioned subdir inside this volume.
    volumes: ["db_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
  uploads:
  hf_cache:                             # persistent HF weights cache (ml)
