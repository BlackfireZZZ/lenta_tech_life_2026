# Local monorepo orchestration. One `docker compose up --build` brings up the
# whole product. See docs/architecture.md §6 and docs/runbooks/docker-compose.md.
#
# backend runs MOCK_MODE=true (deterministic mock; db/redis start but aren't
# used yet — it does not call ml until the backend↔ML wiring lands). `ml` is
# the REAL GPU pipeline image (CUDA + Qwen3-VL); weights are mounted, not
# baked (see the ml service). The root ./Dockerfile is the separate CUDA
# *training* image — not used here.

services:
  backend:
    build: { context: ./backend }
    ports: ["8000:8000"]
    env_file: [./backend/.env]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      ML_BASE_URL: http://ml:8002
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/app:/app/app          # hot-reload
      - uploads:/data/uploads           # shared with ml (video handoff, §5)
    depends_on:
      ml: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_POLLING: "true"          # REQUIRED on Windows+Docker for HMR
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  ml:
    # Context is the repo ROOT (not ./ml): runner.py imports the pipeline
    # from projects/price_tag_pipeline, which must be in the build context.
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports: ["8002:8002"]                # internal service; exposed for debugging
    environment:
      HF_HOME: /models/hf               # weights cache → the hf_cache volume
      HF_HUB_ENABLE_HF_TRANSFER: "1"    # fast Qwen/detector download
      ML_PIPELINE_CONFIG: projects/price_tag_pipeline/configs/balanced.yaml
      # ML_MOCK unset → real GPU pipeline. Set ML_MOCK=1 to force the mock CSV
      # (boots without GPU/weights — architecture.md §5).
    volumes:
      - uploads:/data/uploads           # reads videos the backend wrote
      - hf_cache:/models/hf             # MODEL WEIGHTS live here, NOT in the
                                        # image: Qwen3-VL-4B (~8GB) + the OFF
                                        # detector download once, then persist.
    # GPU passthrough. Works with `docker compose up` on Docker Desktop +
    # WSL2 (no NVIDIA Container Toolkit needed on Windows). If your Compose
    # is too old for this block, use the top-level `gpus: all` key instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
  uploads:
  hf_cache:                             # persistent HF weights cache (ml)
