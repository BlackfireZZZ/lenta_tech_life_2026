repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python]
      - id: ruff-format
        types_or: [python]

  # Guard against committing trained-model weights by mistake.
  - repo: local
    hooks:
      - id: no-checkpoints
        name: refuse to commit *.pt / *.pth / *.onnx / *.safetensors
        entry: bash -c 'for f in "$@"; do case "$f" in *.pt|*.pth|*.onnx|*.safetensors) echo "Refusing $f"; exit 1;; esac; done; exit 0' --
        language: system
        types: [file]
        stages: [pre-commit]
